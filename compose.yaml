name: rekakebijakan

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rekakebijakan}
      POSTGRES_USER: ${POSTGRES_USER:-rekakebijakan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rekakebijakan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-rk_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}
    depends_on:
      database:
        condition: service_healthy

volumes:
  backend_data:
  postgres_data:
