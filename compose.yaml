name: rekakebijakan

services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/rekakebijakan.sqlite3
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-rk_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  backend_data:
