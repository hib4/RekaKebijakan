name: rekakebijakan

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rekakebijakan}
      POSTGRES_USER: ${POSTGRES_USER:-rekakebijakan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rekakebijakan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: production
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-rk_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-16777216}
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-16777216}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-20}
      MAX_ACTIVE_PROJECTS_PER_USER: ${MAX_ACTIVE_PROJECTS_PER_USER:-100}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-30}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-5000}
      POLICY_PROVIDER: ${POLICY_PROVIDER:-deterministic}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-deterministic}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      EMBEDDED_WORKER: "false"
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_STORAGE_PREFIX: ${FIREBASE_STORAGE_PREFIX:-rekakebijakan}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-service-account.json}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      PRODUCTION: ${PRODUCTION:-false}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-10}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-300}
      OASIS_RUNTIME_BASE_URL: ${OASIS_RUNTIME_BASE_URL:-http://oasis-runtime:5001}
      OASIS_RUNTIME_SERVICE_TOKEN: ${OASIS_RUNTIME_SERVICE_TOKEN:-}
      OASIS_RUNTIME_ENABLED: ${OASIS_RUNTIME_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      oasis-runtime:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/dev/null}:/app/secrets/firebase-service-account.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s

  worker:
    build:
      context: ./backend
      target: production
    command: ["python", "worker.py"]
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}}
      UPLOAD_DIR: /app/data/uploads
      POLICY_PROVIDER: ${POLICY_PROVIDER:-deterministic}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_POLICY: ${LLM_FALLBACK_POLICY:-deterministic}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2500}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-0.5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-180}
      JOB_DELAY: ${JOB_DELAY:-0.08}
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-16777216}
      MAX_TOTAL_UPLOAD_BYTES: ${MAX_TOTAL_UPLOAD_BYTES:-1073741824}
      MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-20}
      MAX_ACTIVE_PROJECTS_PER_USER: ${MAX_ACTIVE_PROJECTS_PER_USER:-100}
      PROJECT_RETENTION_DAYS: ${PROJECT_RETENTION_DAYS:-30}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-2000000}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-5000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      FIREBASE_STORAGE_PREFIX: ${FIREBASE_STORAGE_PREFIX:-rekakebijakan}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase-service-account.json}
      OASIS_RUNTIME_BASE_URL: ${OASIS_RUNTIME_BASE_URL:-http://oasis-runtime:5001}
      OASIS_RUNTIME_SERVICE_TOKEN: ${OASIS_RUNTIME_SERVICE_TOKEN:-}
      OASIS_RUNTIME_ENABLED: ${OASIS_RUNTIME_ENABLED:-false}
    volumes:
      - backend_data:/app/data
      - ${FIREBASE_CREDENTIALS_HOST_PATH:-/dev/null}:/app/secrets/firebase-service-account.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      oasis-runtime:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  oasis-runtime:
    build:
      context: ./oasis-runtime
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      FLASK_DEBUG: "false"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_NAME: ${LLM_MODEL:-gpt-4o-mini}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
      OASIS_RUNTIME_SERVICE_TOKEN: ${OASIS_RUNTIME_SERVICE_TOKEN:-}
      OASIS_STEP_TIMEOUT_SECONDS: ${OASIS_STEP_TIMEOUT_SECONDS:-180}
      OASIS_RUN_STALE_TIMEOUT_SECONDS: ${OASIS_RUN_STALE_TIMEOUT_SECONDS:-600}
      OASIS_RUN_MAX_SECONDS: ${OASIS_RUN_MAX_SECONDS:-3600}
      OASIS_CONCURRENCY: ${OASIS_CONCURRENCY:-5}
    expose:
      - "5001"
    volumes:
      - oasis_runtime_data:/app/backend/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-rekakebijakan}:${POSTGRES_PASSWORD:-rekakebijakan}@database:5432/${POSTGRES_DB:-rekakebijakan}}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./evaluations:/evaluations:ro

volumes:
  backend_data:
  oasis_runtime_data:
  postgres_data:
