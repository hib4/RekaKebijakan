name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rekakebijakan_test
          POSTGRES_USER: rekakebijakan
          POSTGRES_PASSWORD: rekakebijakan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekakebijakan -d rekakebijakan_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rekakebijakan:rekakebijakan@127.0.0.1:5432/rekakebijakan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Verify single migration head
        run: test "$(alembic heads | wc -l | tr -d ' ')" = 1
      - run: alembic upgrade head
      - run: alembic current --check-heads
      - run: alembic check
      - run: python -m pytest -vv
      - run: python -m app.evaluation --fail-threshold 0.8

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production --tag rekakebijakan-backend:ci backend
      - run: docker build --target production --tag rekakebijakan-frontend:ci frontend
