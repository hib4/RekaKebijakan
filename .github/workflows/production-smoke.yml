name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production stack
        env:
          JOB_DELAY: "0.01"
        run: docker compose -f compose.yaml -f compose.full.yaml up --build --detach --wait
      - name: Run workflow smoke through frontend proxy
        run: sh scripts/production-smoke.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.full.yaml logs --no-color
      - name: Stop stack without deleting volumes
        if: always()
        run: docker compose -f compose.yaml -f compose.full.yaml down
