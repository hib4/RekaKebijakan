[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rekakebijakan-backend"
version = "0.1.0"
description = "Authenticated FastAPI policy simulation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1",
  "uvicorn>=0.51,<1",
  "python-multipart>=0.0.22,<1",
  "Werkzeug>=3.1,<4",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.25,<2",
  "python-docx==1.2.0",
  "lxml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]
llm = ["openai>=1.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
